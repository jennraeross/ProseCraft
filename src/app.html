<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="ProseCraft is a novel-writing app with tools for outlining, storyboarding and publishing." />
    <meta name="theme-color" content="#f8f8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191b19" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ProseCraft" />
    <meta name="format-detection" content="telephone=no" />
    <title>ProseCraft</title>
    <script>
      (() => {
        const root = document.documentElement;
        let theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        let scheme = "prosecraft";
        try {
          const savedTheme = localStorage.getItem("prosecraft-theme");
          if (savedTheme === "light" || savedTheme === "dark") {
            theme = savedTheme;
          }
          const savedScheme = localStorage.getItem("prosecraft-color-scheme");
          const schemes = [
            "prosecraft",
            "nord",
            "gruvbox",
            "solarized",
            "catppuccin",
            "everforest",
            "rose-pine",
            "dracula"
          ];
          if (schemes.includes(savedScheme)) scheme = savedScheme;
        } catch {
          // Local storage may be unavailable; the defaults above still apply.
        }
        root.dataset.theme = theme;
        root.dataset.colorScheme = scheme;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
