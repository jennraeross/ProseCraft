name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run check

      # The desktop build leaves the base path empty; only this deploy needs it.
      - name: Build web app for the /app/ subpath
        run: npm run build
        env:
          PAGES_BASE: /ProseCraft/app
          # Optional: set VITE_GOOGLE_CLIENT_SECRET in repo Actions secrets so
          # hardware QA can test Google Drive sync. Local .env.local is never
          # committed; an empty secret still builds, Drive just reports config error.
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}

      - name: Verify PWA output
        run: |
          test -f build/manifest.webmanifest
          test -f build/service-worker.js
          test -f build/icons/icon-192.png
          test -f build/icons/icon-512.png
          test -f build/icons/maskable-512.png
          test -f build/icons/apple-touch-icon.png
          grep -q '/ProseCraft/app/manifest.webmanifest' build/index.html

      - name: Assemble the site
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r build/. _site/app/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
