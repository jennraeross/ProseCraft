name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build web app
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: prosecraft-web-build
          path: build
          if-no-files-found: error
          retention-days: 7
